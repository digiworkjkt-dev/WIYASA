<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto">
  <defs>
    <!-- Filter bayangan halus untuk frame jendela -->
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#182332" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Jendela Mockup Aplikasi (Window Container) -->
  <rect x="5" y="5" width="590" height="310" rx="8" fill="#ffffff" stroke="#9eaeba" stroke-width="1.5" filter="url(#window-shadow)"/>

  <!-- Window Header / Title Bar -->
  <rect x="5" y="5" width="590" height="30" rx="8" fill="#eef2f5"/>
  <rect x="5" y="27" width="590" height="8" fill="#eef2f5"/>
  <line x1="5" y1="35" x2="595" y2="35" stroke="#9eaeba" stroke-width="1"/>

  <!-- Window Control Dots (macOS/Modern style) -->
  <circle cx="25" cy="20" r="5" fill="#e57373"/>
  <circle cx="40" cy="20" r="5" fill="#ffb74d"/>
  <circle cx="55" cy="20" r="5" fill="#81c784"/>

  <!-- Browser / App URL bar -->
  <rect x="80" y="11" width="300" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="90" y="24" font-family="Cambria, serif" font-size="10" fill="#64748b">https://app.example.com/dashboard</text>

  <!-- Navigation Sidebar -->
  <rect x="5" y="35" width="120" height="280" fill="#f8fafc"/>
  <line x1="125" y1="35" x2="125" y2="315" stroke="#cbd5e1" stroke-width="1"/>

  <text x="20" y="60" font-family="Cambria, serif" font-size="11" font-weight="bold" fill="#183d54">MENU UTAMA</text>
  
  <!-- Active menu item -->
  <rect x="12" y="72" width="105" height="24" rx="4" fill="#e0f2fe"/>
  <text x="25" y="88" font-family="Cambria, serif" font-size="11" font-weight="bold" fill="#0369a1">Dashboard</text>

  <!-- Inactive menu items -->
  <text x="25" y="116" font-family="Cambria, serif" font-size="11" fill="#475569">Pemesanan / Transaksi</text>
  <text x="25" y="142" font-family="Cambria, serif" font-size="11" fill="#475569">Jadwal &amp; Kalender</text>
  <text x="25" y="168" font-family="Cambria, serif" font-size="11" fill="#475569">Laporan</text>
  <text x="25" y="194" font-family="Cambria, serif" font-size="11" fill="#475569">Pengaturan Akun</text>

  <!-- Main Content Area -->
  <g transform="translate(140, 50)">
    <!-- Content Header -->
    <text x="0" y="15" font-family="Cambria, serif" font-size="15" font-weight="bold" fill="#183d54">Dashboard Pengguna</text>
    <text x="0" y="30" font-family="Cambria, serif" font-size="11" fill="#64748b">Selamat datang kembali! Berikut ikhtisar aktivitas aktif Anda.</text>

    <!-- Stat Card 1 -->
    <rect x="0" y="42" width="135" height="55" rx="6" fill="#f1f5f8" stroke="#cbd5e1"/>
    <text x="12" y="58" font-family="Cambria, serif" font-size="10" fill="#64748b">Jadwal Aktif</text>
    <text x="12" y="82" font-family="Cambria, serif" font-size="18" font-weight="bold" fill="#183d54">3 Slot</text>

    <!-- Stat Card 2 -->
    <rect x="145" y="42" width="135" height="55" rx="6" fill="#f1f5f8" stroke="#cbd5e1"/>
    <text x="157" y="58" font-family="Cambria, serif" font-size="10" fill="#64748b">Menunggu Konfirmasi</text>
    <text x="157" y="82" font-family="Cambria, serif" font-size="18" font-weight="bold" fill="#d97706">1 Antrean</text>

    <!-- Stat Card 3 (Action Button) -->
    <rect x="290" y="42" width="145" height="55" rx="6" fill="#183d54"/>
    <text x="362" y="74" font-family="Cambria, serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Buat Reservasi</text>

    <!-- Table Section in Mockup -->
    <text x="0" y="125" font-family="Cambria, serif" font-size="12" font-weight="bold" fill="#183d54">Daftar Aktivitas Terakhir</text>

    <!-- Table header -->
    <rect x="0" y="135" width="435" height="24" fill="#eef2f5" rx="3"/>
    <text x="10" y="151" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#334155">ID Pemesanan</text>
    <text x="120" y="151" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#334155">Layanan / Item</text>
    <text x="240" y="151" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#334155">Tanggal &amp; Waktu</text>
    <text x="360" y="151" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#334155">Status</text>

    <!-- Table Row 1 -->
    <line x1="0" y1="185" x2="435" y2="185" stroke="#e2e8f0"/>
    <text x="10" y="176" font-family="Cambria, serif" font-size="10" fill="#182332">#RSV-2026-081</text>
    <text x="120" y="176" font-family="Cambria, serif" font-size="10" fill="#182332">Lapangan Utama A</text>
    <text x="240" y="176" font-family="Cambria, serif" font-size="10" fill="#182332">Besok, 19:00 WIB</text>
    <rect x="355" y="165" width="65" height="18" rx="9" fill="#dcfce7"/>
    <text x="387" y="177" font-family="Cambria, serif" font-size="9" font-weight="bold" fill="#166534" text-anchor="middle">Terkonfirmasi</text>

    <!-- Table Row 2 -->
    <line x1="0" y1="210" x2="435" y2="210" stroke="#e2e8f0"/>
    <text x="10" y="201" font-family="Cambria, serif" font-size="10" fill="#182332">#RSV-2026-079</text>
    <text x="120" y="201" font-family="Cambria, serif" font-size="10" fill="#182332">Ruang VIP Room 2</text>
    <text x="240" y="201" font-family="Cambria, serif" font-size="10" fill="#182332">3 Nov, 14:00 WIB</text>
    <rect x="355" y="190" width="65" height="18" rx="9" fill="#fef3c7"/>
    <text x="387" y="202" font-family="Cambria, serif" font-size="9" font-weight="bold" fill="#92400e" text-anchor="middle">Menunggu</text>
  </g>
</svg>
