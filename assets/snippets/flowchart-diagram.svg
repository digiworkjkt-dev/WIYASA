<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="auto">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#183d54" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="160" fill="#f8fafc" rx="6" stroke="#9eaeba" stroke-width="1"/>

  <!-- Step 1: Start / Request -->
  <rect x="20" y="55" width="100" height="50" rx="25" fill="#ffffff" stroke="#183d54" stroke-width="1.5"/>
  <text x="70" y="84" font-family="Cambria, serif" font-size="12" font-weight="bold" fill="#183d54" text-anchor="middle">Mulai Request</text>

  <line x1="120" y1="80" x2="158" y2="80" stroke="#183d54" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- Step 2: Validation -->
  <rect x="160" y="55" width="110" height="50" rx="4" fill="#ffffff" stroke="#183d54" stroke-width="1.5"/>
  <text x="215" y="77" font-family="Cambria, serif" font-size="11" font-weight="bold" fill="#183d54" text-anchor="middle">Validasi Input</text>
  <text x="215" y="93" font-family="Cambria, serif" font-size="10" fill="#526675" text-anchor="middle">&amp; Izin Akses</text>

  <line x1="270" y1="80" x2="308" y2="80" stroke="#183d54" stroke-width="1.5" marker-end="url(#flow-arrow)"/>

  <!-- Step 3: Decision Diamond -->
  <polygon points="360,40 410,80 360,120 310,80" fill="#eef2f5" stroke="#183d54" stroke-width="1.5"/>
  <text x="360" y="84" font-family="Cambria, serif" font-size="11" font-weight="bold" fill="#183d54" text-anchor="middle">Valid?</text>

  <!-- Branch: Valid (Yes) -> Process -> Success -->
  <line x1="410" y1="80" x2="448" y2="80" stroke="#183d54" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="428" y="72" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#183d54">Ya</text>

  <rect x="450" y="55" width="125" height="50" rx="4" fill="#eaf5ea" stroke="#2d6a2e" stroke-width="1.5"/>
  <text x="512" y="77" font-family="Cambria, serif" font-size="11" font-weight="bold" fill="#2d6a2e" text-anchor="middle">Simpan &amp; Commit</text>
  <text x="512" y="93" font-family="Cambria, serif" font-size="10" fill="#2d6a2e" text-anchor="middle">Response 200/201</text>

  <!-- Branch: Invalid (No) -> Down -> Error Response -->
  <line x1="360" y1="120" x2="360" y2="138" stroke="#a33b3b" stroke-width="1.5"/>
  <line x1="360" y1="138" x2="448" y2="138" stroke="#a33b3b" stroke-width="1.5" marker-end="url(#flow-arrow)"/>
  <text x="370" y="132" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#a33b3b">Tidak</text>

  <rect x="450" y="115" width="125" height="40" rx="4" fill="#fdf0f0" stroke="#a33b3b" stroke-width="1.5"/>
  <text x="512" y="135" font-family="Cambria, serif" font-size="10" font-weight="bold" fill="#a33b3b" text-anchor="middle">Error 400 / 403 / 422</text>
</svg>
