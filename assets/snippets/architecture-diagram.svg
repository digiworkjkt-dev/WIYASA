<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="auto">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#183d54" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="220" fill="#f8fafc" rx="6" stroke="#9eaeba" stroke-width="1"/>

  <!-- Tier 1: Client Layer -->
  <g transform="translate(20, 25)">
    <rect width="160" height="170" rx="4" fill="#ffffff" stroke="#183d54" stroke-width="1.5"/>
    <rect width="160" height="32" rx="4" fill="#eef2f5" stroke="#183d54" stroke-width="1.5"/>
    <text x="80" y="21" font-family="Cambria, serif" font-size="13" font-weight="bold" fill="#183d54" text-anchor="middle">Client Layer</text>
    <rect x="15" y="45" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="65" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Web Browser (SPA)</text>
    <rect x="15" y="85" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="105" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Mobile App (PWA/Native)</text>
    <rect x="15" y="125" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="145" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Role: User / Admin</text>
  </g>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <line x1="180" y1="110" x2="218" y2="110" stroke="#183d54" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 2: Backend Application Service Layer -->
  <g transform="translate(220, 25)">
    <rect width="160" height="170" rx="4" fill="#ffffff" stroke="#183d54" stroke-width="1.5"/>
    <rect width="160" height="32" rx="4" fill="#eef2f5" stroke="#183d54" stroke-width="1.5"/>
    <text x="80" y="21" font-family="Cambria, serif" font-size="13" font-weight="bold" fill="#183d54" text-anchor="middle">Application Layer</text>
    <rect x="15" y="45" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="65" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">API Gateway &amp; Auth</text>
    <rect x="15" y="85" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="105" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Core Business Services</text>
    <rect x="15" y="125" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="145" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Audit &amp; Logging Filter</text>
  </g>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <line x1="380" y1="110" x2="418" y2="110" stroke="#183d54" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tier 3: Data & Storage Layer -->
  <g transform="translate(420, 25)">
    <rect width="160" height="170" rx="4" fill="#ffffff" stroke="#183d54" stroke-width="1.5"/>
    <rect width="160" height="32" rx="4" fill="#eef2f5" stroke="#183d54" stroke-width="1.5"/>
    <text x="80" y="21" font-family="Cambria, serif" font-size="13" font-weight="bold" fill="#183d54" text-anchor="middle">Data Layer</text>
    <rect x="15" y="45" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="65" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Relational DB (PostgreSQL)</text>
    <rect x="15" y="85" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="105" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">Cache / Session (Redis)</text>
    <rect x="15" y="125" width="130" height="32" rx="3" fill="#f1f5f8" stroke="#a4b5c1"/>
    <text x="80" y="145" font-family="Cambria, serif" font-size="11" fill="#182332" text-anchor="middle">File Storage / S3</text>
  </g>
</svg>
